dimensions:
- name: day
  type: time
  label: Day
  description: Stable date identity for notes on Day breakdowns. Other breakdowns and totals return NULL.
  expression: >-
    CASE WHEN '{{ filters.breakdown }}' = 'Day' AND total_row_style = 0
    THEN SAFE_CAST(breakdown_1 AS DATE) ELSE NULL END
  granularities:
    day: >-
      CASE WHEN '{{ filters.breakdown }}' = 'Day' AND total_row_style = 0
      THEN SAFE_CAST(breakdown_1 AS DATE) ELSE NULL END
