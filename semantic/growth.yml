            pred_m6,
            pred_m7,
            pred_m8,
            pred_m9,
            pred_m10,
            pred_m11,
            model,
            cohort_age
          FROM growth_source
          WHERE model = IF('{{ filters.prediction_model }}' = 'Hidden Object', 'current', '{{ filters.prediction_model }}')
            AND day BETWEEN DATE('{{ filters.date_range.start }}') AND LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY))
            {% if filters.day %}AND day IN ({% for selected_day in filters.day %}DATE({{ selected_day | tojson }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.app %}AND app IN ({% for v in filters.app %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.include_country %}AND country IN ({% for v in filters.include_country %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.language_group %}AND CASE
              WHEN country IN ('Turkey') THEN 'Turkish Speaking'
              WHEN country IN ('Germany', 'Austria', 'Liechtenstein') THEN 'German Speaking'
              WHEN country IN (
                'France', 'Monaco', 'Senegal', 'Cote d\'Ivoire', 'Mali', 'Burkina Faso', 'Niger',
                'Guinea', 'Benin', 'Togo', 'Gabon', 'Republic Of Congo', 'Democratic Republic Of Congo',
                'Chad', 'Madagascar', 'Djibouti', 'Haiti', 'Burundi', 'Central African Republic',
                'Comoros', 'Reunion', 'Guadeloupe', 'Martinique', 'French Guiana', 'Mayotte',
                'New Caledonia', 'French Polynesia'
              ) THEN 'French Speaking'
              WHEN country IN ('Russia', 'Belarus', 'Kazakhstan', 'Kyrgyzstan') THEN 'Russian Speaking'
              WHEN country IN (
                'Brazil', 'Portugal', 'Angola', 'Mozambique', 'Cape Verde', 'Guinea-bissau',
                'Sao Tome And Principe'
              ) THEN 'Portuguese Speaking'
              WHEN country IN (
                'Spain', 'Mexico', 'Argentina', 'Colombia', 'Chile', 'Peru',
                'Venezuela, Bolivarian Republic Of', 'Ecuador', 'Bolivia, Plurinational State Of',
                'Paraguay', 'Uruguay', 'Guatemala', 'Honduras', 'El Salvador', 'Nicaragua',
                'Costa Rica', 'Panama', 'Dominican Republic', 'Puerto Rico', 'Equatorial Guinea'
              ) THEN 'Spanish Speaking'
              WHEN country IN (
                'United States', 'United Kingdom', 'Canada', 'Australia', 'Ireland', 'New Zealand',
                'Jamaica', 'Bahamas', 'Barbados', 'Trinidad And Tobago', 'Belize', 'Guyana',
                'Singapore', 'South Africa', 'Malta', 'Nigeria', 'India', 'Philippines', 'Fiji'
              ) THEN 'English Speaking'
              ELSE 'Other'
            END IN ({% for v in filters.language_group %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.exclude_country %}AND country NOT IN ({% for v in filters.exclude_country %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.store_type and filters.store_type != 'All' %}AND store_type = '{{ filters.store_type }}'{% endif %}
            {% if filters.channel %}AND channel IN ({% for v in filters.channel %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.campaign_name %}AND campaign_network IN ({% for v in filters.campaign_name %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
            {% if filters.ad_group %}AND adgroup_network IN ({% for v in filters.ad_group %}{{ v | tojson }}{% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
        ), labeled AS (
          SELECT *,
            CASE
              WHEN '{{ filters.breakdown }}' = 'Channel' THEN channel
              WHEN '{{ filters.breakdown }}' = 'Country' THEN country
              WHEN '{{ filters.breakdown }}' = 'Language Group' THEN CASE
              WHEN country IN ('Turkey') THEN 'Turkish Speaking'
              WHEN country IN ('Germany', 'Austria', 'Liechtenstein') THEN 'German Speaking'
              WHEN country IN (
                'France', 'Monaco', 'Senegal', 'Cote d\'Ivoire', 'Mali', 'Burkina Faso', 'Niger',
                'Guinea', 'Benin', 'Togo', 'Gabon', 'Republic Of Congo', 'Democratic Republic Of Congo',
                'Chad', 'Madagascar', 'Djibouti', 'Haiti', 'Burundi', 'Central African Republic',
                'Comoros', 'Reunion', 'Guadeloupe', 'Martinique', 'French Guiana', 'Mayotte',
                'New Caledonia', 'French Polynesia'
              ) THEN 'French Speaking'
              WHEN country IN ('Russia', 'Belarus', 'Kazakhstan', 'Kyrgyzstan') THEN 'Russian Speaking'
              WHEN country IN (
                'Brazil', 'Portugal', 'Angola', 'Mozambique', 'Cape Verde', 'Guinea-bissau',
                'Sao Tome And Principe'
              ) THEN 'Portuguese Speaking'
              WHEN country IN (
                'Spain', 'Mexico', 'Argentina', 'Colombia', 'Chile', 'Peru',
                'Venezuela, Bolivarian Republic Of', 'Ecuador', 'Bolivia, Plurinational State Of',
                'Paraguay', 'Uruguay', 'Guatemala', 'Honduras', 'El Salvador', 'Nicaragua',
                'Costa Rica', 'Panama', 'Dominican Republic', 'Puerto Rico', 'Equatorial Guinea'
              ) THEN 'Spanish Speaking'
              WHEN country IN (
                'United States', 'United Kingdom', 'Canada', 'Australia', 'Ireland', 'New Zealand',
                'Jamaica', 'Bahamas', 'Barbados', 'Trinidad And Tobago', 'Belize', 'Guyana',
                'Singapore', 'South Africa', 'Malta', 'Nigeria', 'India', 'Philippines', 'Fiji'
              ) THEN 'English Speaking'
              ELSE 'Other'
            END
              WHEN '{{ filters.breakdown }}' = 'Country & Store Type' THEN country
              WHEN '{{ filters.breakdown }}' = 'Channel & Store Type' THEN channel
              WHEN '{{ filters.breakdown }}' = 'App' THEN app
              WHEN '{{ filters.breakdown }}' IN ('Campaign Name', 'Campaign Name & Ad Group', 'Campaign Name & Ad Name') THEN campaign_network
              WHEN '{{ filters.breakdown }}' = 'Week' THEN CAST(DATE_TRUNC(day, WEEK(MONDAY)) AS STRING)
              WHEN '{{ filters.breakdown }}' = 'Month' THEN CAST(DATE_TRUNC(day, MONTH) AS STRING)
              ELSE CAST(day AS STRING)
            END AS breakdown_1,
            CASE
              WHEN '{{ filters.breakdown }}' IN ('Country & Store Type', 'Channel & Store Type') THEN store_type
              WHEN '{{ filters.breakdown }}' = 'Campaign Name & Ad Group' THEN adgroup_network
              WHEN '{{ filters.breakdown }}' = 'Campaign Name & Ad Name' THEN creative_network
              ELSE NULL
            END AS breakdown_2
          FROM base
        ), aggregated AS (
          SELECT
            breakdown_1,
            breakdown_2,
            MAX(model) AS model,
            COUNT(DISTINCT day) AS days_in_bucket,
            SUM(daus) AS total_dau,
            SUM(installs) AS total_installs,
            SUM(sessions) AS total_sessions,
            SUM(all_revenue) AS total_revenue,
            SUM(cost) AS total_cost,
            SUM(cohort_all_revenue) AS cohort_all_revenue,
            SUM(time_spent_d7) AS total_time_spent_d7,
            SUM(time_spent_d30) AS total_time_spent_d30,
            SUM(inter_impression_events) AS total_inter,
            SUM(rewarded_impression_events) AS total_rewarded,
            SUM(purchase_events) AS total_purchase_events,
            SUM(purchase_revenue) AS total_purchase_revenue,
            SUM(all_revenue_total_d0) AS rev_d0,
            SUM(CASE WHEN '{{ filters.breakdown }}' IN ('Week', 'Month', 'Day') AND channel = 'Organic' AND store_type = 'google_play' THEN installs END) AS organic_play_installs,
            SUM(CASE WHEN '{{ filters.breakdown }}' IN ('Week', 'Month', 'Day') AND store_type = 'app_store' THEN installs - skad_installs END) AS organic_appstore_installs,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END) AS rev_d1,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN cost END) AS cost_d1,
            MAX(IF(pred_d1, 1, 0)) AS flag_d1,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d3 THEN all_revenue_total_d3 END) AS rev_d3,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d3 THEN cost END) AS cost_d3,
            MAX(IF(pred_d3, 1, 0)) AS flag_d3,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END) AS rev_d7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN cost END) AS cost_d7,
            MAX(IF(pred_d7, 1, 0)) AS flag_d7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d14 THEN all_revenue_total_d14 END) AS rev_d14,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d14 THEN cost END) AS cost_d14,
            MAX(IF(pred_d14, 1, 0)) AS flag_d14,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END) AS rev_d30,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN cost END) AS cost_d30,
            MAX(IF(pred_d30, 1, 0)) AS flag_d30,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d60 THEN all_revenue_total_d60 END) AS rev_d60,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d60 THEN cost END) AS cost_d60,
            MAX(IF(pred_d60, 1, 0)) AS flag_d60,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d90 THEN all_revenue_total_d90 END) AS rev_d90,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d90 THEN cost END) AS cost_d90,
            MAX(IF(pred_d90, 1, 0)) AS flag_d90,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d120 THEN all_revenue_total_d120 END) AS rev_d120,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d120 THEN cost END) AS cost_d120,
            MAX(IF(pred_d120, 1, 0)) AS flag_d120,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m4 THEN all_revenue_total_m4 END) AS rev_m4,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m4 THEN cost END) AS cost_m4,
            MAX(IF(pred_m4, 1, 0)) AS flag_m4,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m5 THEN all_revenue_total_m5 END) AS rev_m5,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m5 THEN cost END) AS cost_m5,
            MAX(IF(pred_m5, 1, 0)) AS flag_m5,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m6 THEN all_revenue_total_m6 END) AS rev_m6,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m6 THEN cost END) AS cost_m6,
            MAX(IF(pred_m6, 1, 0)) AS flag_m6,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m7 THEN all_revenue_total_m7 END) AS rev_m7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m7 THEN cost END) AS cost_m7,
            MAX(IF(pred_m7, 1, 0)) AS flag_m7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m8 THEN all_revenue_total_m8 END) AS rev_m8,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m8 THEN cost END) AS cost_m8,
            MAX(IF(pred_m8, 1, 0)) AS flag_m8,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m9 THEN all_revenue_total_m9 END) AS rev_m9,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m9 THEN cost END) AS cost_m9,
            MAX(IF(pred_m9, 1, 0)) AS flag_m9,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m10 THEN all_revenue_total_m10 END) AS rev_m10,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m10 THEN cost END) AS cost_m10,
            MAX(IF(pred_m10, 1, 0)) AS flag_m10,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN all_revenue_total_m11 END) AS rev_m11,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN cost END) AS cost_m11,
            MAX(IF(pred_m11, 1, 0)) AS flag_m11,
            SUM(CASE WHEN cohort_age > 1 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN retained_users_d1 END) AS ret_d1,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN installs END) AS retention_installs_d1,
            SUM(CASE WHEN cohort_age > 3 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 3 DAY) THEN retained_users_d3 END) AS ret_d3,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 3 DAY) THEN installs END) AS retention_installs_d3,
            SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d7 END) AS ret_d7,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN installs END) AS retention_installs_d7,
            SUM(CASE WHEN cohort_age > 14 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 14 DAY) THEN retained_users_d14 END) AS ret_d14,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 14 DAY) THEN installs END) AS retention_installs_d14,
            SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d30 END) AS ret_d30,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN installs END) AS retention_installs_d30,
            SUM(CASE WHEN cohort_age > 60 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 60 DAY) THEN retained_users_d60 END) AS ret_d60,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 60 DAY) THEN installs END) AS retention_installs_d60,
            SUM(CASE WHEN cohort_age > 90 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 90 DAY) THEN retained_users_d90 END) AS ret_d90,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 90 DAY) THEN installs END) AS retention_installs_d90,
            SUM(CASE WHEN cohort_age > 120 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 120 DAY) THEN retained_users_d120 END) AS ret_d120,
            SUM(CASE WHEN day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 120 DAY) THEN installs END) AS retention_installs_d120,
            SUM(CASE WHEN cohort_age > 3 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 3 DAY) THEN retained_users_d1 END) AS ret_d1_for_d3,
            SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d1 END) AS ret_d1_for_d7,
            SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d7 END) AS ret_d7_for_d30,
            SUM(CASE WHEN cohort_age > 120 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 120 DAY) THEN retained_users_d7 END) AS ret_d7_for_d120,
            SUM(IF(channel = 'Applovin', cost, NULL)) AS applovin_cost,
            SUM(IF(channel = 'Google Ads', cost, NULL)) AS google_ads_cost,
            SUM(IF(channel = 'Facebook', cost, NULL)) AS facebook_cost,
            SUM(IF(channel = 'Unity Ads', cost, NULL)) AS unity_cost,
            SUM(IF(channel = 'Mintegral', cost, NULL)) AS mintegral_cost,
            SUM(IF(channel = 'TikTok for Business', cost, NULL)) AS tiktok_cost,
            SUM(IF(channel = 'Apple', cost, NULL)) AS search_ads_cost
          FROM labeled
          GROUP BY breakdown_1, breakdown_2
        ), calculated AS (
          SELECT
            0 AS total_row_style,
            breakdown_1,
            breakdown_2,
            model,
            total_revenue,
            total_cost AS total_spend,
            total_revenue - total_cost AS profit,
            IF('{{ filters.breakdown }}' IN ('Week', 'Month'), SAFE_DIVIDE(total_dau, days_in_bucket), CAST(total_dau AS FLOAT64)) AS dau,
