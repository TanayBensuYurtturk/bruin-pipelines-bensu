          roas_d180_d30, roas_d180_d30_display, roas_d180_d30_prediction,
          roas_d14_d1
          {% if filters.show_predictions != 'Yes' %}
          , target_roas_d7
          {% endif %}
          {% if filters.breakdown != 'Country & Store Type' and filters.breakdown != 'Channel & Store Type' and filters.breakdown != 'Campaign Name & Ad Group' and filters.breakdown != 'Campaign Name & Ad Name' %}
          , breakdown_2
          {% endif %}
        )
        FROM weekly_roas_display
        ORDER BY total_row_style DESC,
          CASE WHEN '{{ filters.breakdown }}' IN ('Channel', 'Country', 'Language Group', 'Country & Store Type', 'Channel & Store Type', 'App', 'Campaign Name & Ad Group') THEN total_spend END DESC NULLS LAST,
          breakdown_1,
          breakdown_2
      ), normalized AS (
        SELECT original_result.*
    {% if filters.breakdown not in ['Country & Store Type', 'Channel & Store Type', 'Campaign Name & Ad Group', 'Campaign Name & Ad Name'] %}
    , CAST(NULL AS STRING) AS breakdown_2
    {% endif %}
    {% if filters.show_predictions != 'Yes' %}
    , CAST(NULL AS FLOAT64) AS target_roas_d7
    {% endif %}
        FROM original_result
      )
      SELECT normalized.*, ROW_NUMBER() OVER (ORDER BY total_row_style DESC, CASE WHEN '{{ filters.breakdown }}' IN ('Channel', 'Country', 'Language Group', 'Country & Store Type', 'Channel & Store Type', 'App', 'Campaign Name & Ad Group') THEN total_spend END DESC NULLS LAST, breakdown_1, breakdown_2) AS _result_row
      FROM normalized
    ),
    retention_charts_result AS (
