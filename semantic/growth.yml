            CASE
              WHEN SAFE_DIVIDE(SUM(hist_ret_d30), SUM(hist_ret_d7)) < 0.35 THEN 0.98
              WHEN SAFE_DIVIDE(SUM(hist_ret_d30), SUM(hist_ret_d7)) > 0.35 THEN 1.03
              ELSE 1.00
            END AS hidden_object_x
          FROM recent_mature_d30
          GROUP BY calibration_1, calibration_2, forecast_app
          HAVING COUNT(*) > 0
        ), daily_forecast_base AS (
          SELECT
            breakdown_1, breakdown_2, calibration_1, calibration_2, forecast_app, day,
            MAX(model) AS model, MAX(cohort_age) AS cohort_age,
            SUM(all_revenue_total_d0) AS rev_d0,
            SUM(all_revenue_total_d1) AS rev_d1,
            SUM(all_revenue_total_d3) AS rev_d3,
            SUM(all_revenue_total_d7) AS rev_d7,
            SUM(all_revenue_total_d14) AS rev_d14,
            SUM(all_revenue_total_d30) AS rev_d30,
            SUM(all_revenue_total_m11) AS rev_m11,
            SUM(cost) AS cost,
            SUM(retained_users_d7) AS ret_d7,
            SUM(retained_users_d30) AS ret_d30,
            MAX(CAST(pred_m11 AS INT64)) AS flag_m11
          FROM labeled
          WHERE day BETWEEN DATE('{{ filters.date_range.start }}') AND DATE('{{ filters.date_range.end }}')
            {% if filters.day %}AND day IN ({% for selected_day in filters.day %}DATE({{ selected_day | tojson }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
          GROUP BY breakdown_1, breakdown_2, calibration_1, calibration_2, forecast_app, day
        ), install_daily AS (
          SELECT
            breakdown_1,
            breakdown_2,
            day,
            SUM(installs) AS installs,
            SUM(cost) AS cost,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN cost END)
            ) AS roas_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN cost END)
            ) AS roas_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN cost END)
            ) AS roas_d30,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END)
            ) AS roas_d7_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END)
            ) AS roas_d30_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN all_revenue_total_m11 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN cost END)
            ) AS roas_m11,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d1, FALSE), FALSE)) AS roas_d1_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d7, FALSE), FALSE)) AS roas_d7_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d30, FALSE), FALSE)) AS roas_d30_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d1, FALSE) OR COALESCE(pred_d7, FALSE), FALSE)) AS roas_d7_d1_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d7, FALSE) OR COALESCE(pred_d30, FALSE), FALSE)) AS roas_d30_d7_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_m11, FALSE), FALSE)) AS roas_m11_is_predicted,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 1 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN retained_users_d1 END),
              SUM(CASE WHEN cohort_age > 1 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN installs END)
            ) AS retention_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d7 END),
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN installs END)
            ) AS retention_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d7 END),
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d1 END)
            ) AS retention_d7_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d30 END),
              SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d7 END)
            ) AS retention_d30_d7
          FROM labeled
          WHERE day <= DATE('{{ filters.date_range.end }}')
          GROUP BY breakdown_1, breakdown_2, day
        ), install_visualization AS (
          SELECT
            breakdown_1,
            breakdown_2,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(installs IS NULL, NULL, STRUCT(day AS day, CAST(installs AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS install_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(cost IS NULL, NULL, STRUCT(day AS day, CAST(cost AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS cost_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d1 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d1 AS FLOAT64) AS value, roas_d1_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d7 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d7 AS FLOAT64) AS value, roas_d7_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d30 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d30 AS FLOAT64) AS value, roas_d30_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d30_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d7_d1 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d7_d1 AS FLOAT64) AS value, roas_d7_d1_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d7_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d30_d7 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d30_d7 AS FLOAT64) AS value, roas_d30_d7_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d30_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_m11 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_m11 AS FLOAT64) AS value, roas_m11_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_m11_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d1 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d1 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d7 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d7 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d7_d1 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d7_d1 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d7_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d30_d7 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d30_d7 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d30_d7_visualization
          {% if filters.breakdown == 'Day' %}
          FROM (
            SELECT anchor.breakdown_1, anchor.breakdown_2,
              history.* EXCEPT (breakdown_1, breakdown_2)
            FROM install_daily AS anchor
            JOIN install_daily AS history
              ON history.day BETWEEN DATE_SUB(anchor.day, INTERVAL 29 DAY) AND anchor.day
            WHERE anchor.day BETWEEN DATE('{{ filters.date_range.start }}') AND DATE('{{ filters.date_range.end }}')
            {% if filters.day %}AND anchor.day IN ({% for selected_day in filters.day %}DATE({{ selected_day | tojson }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
          )
          {% else %}
          FROM install_daily
          {% endif %}
          GROUP BY breakdown_1, breakdown_2
        ), totals_install_daily AS (
          SELECT
            day,
            SUM(installs) AS installs,
            SUM(cost) AS cost,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN cost END)
            ) AS roas_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN cost END)
            ) AS roas_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN cost END)
            ) AS roas_d30,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END)
            ) AS roas_d7_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END)
            ) AS roas_d30_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN all_revenue_total_m11 END),
              SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN cost END)
            ) AS roas_m11,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d1, FALSE), FALSE)) AS roas_d1_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d7, FALSE), FALSE)) AS roas_d7_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d30, FALSE), FALSE)) AS roas_d30_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d1, FALSE) OR COALESCE(pred_d7, FALSE), FALSE)) AS roas_d7_d1_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_d7, FALSE) OR COALESCE(pred_d30, FALSE), FALSE)) AS roas_d30_d7_is_predicted,
            LOGICAL_OR(IF('{{ filters.show_predictions }}' = 'Yes', COALESCE(pred_m11, FALSE), FALSE)) AS roas_m11_is_predicted,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 1 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN retained_users_d1 END),
              SUM(CASE WHEN cohort_age > 1 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 1 DAY) THEN installs END)
            ) AS retention_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d7 END),
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN installs END)
            ) AS retention_d7,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d7 END),
              SUM(CASE WHEN cohort_age > 7 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 7 DAY) THEN retained_users_d1 END)
            ) AS retention_d7_d1,
            SAFE_DIVIDE(
              SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d30 END),
              SUM(CASE WHEN cohort_age > 30 AND day <= DATE_SUB(LEAST(DATE('{{ filters.date_range.end }}'), DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)), INTERVAL 30 DAY) THEN retained_users_d7 END)
            ) AS retention_d30_d7
          FROM labeled
          WHERE day <= DATE('{{ filters.date_range.end }}')
          GROUP BY day
        ), totals_visualization AS (
          SELECT

            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(installs IS NULL, NULL, STRUCT(day AS day, CAST(installs AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS install_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(cost IS NULL, NULL, STRUCT(day AS day, CAST(cost AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS cost_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d1 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d1 AS FLOAT64) AS value, roas_d1_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d7 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d7 AS FLOAT64) AS value, roas_d7_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d30 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d30 AS FLOAT64) AS value, roas_d30_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d30_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d7_d1 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d7_d1 AS FLOAT64) AS value, roas_d7_d1_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d7_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_d30_d7 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_d30_d7 AS FLOAT64) AS value, roas_d30_d7_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_d30_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(roas_m11 IS NULL OR day > DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY), NULL, STRUCT(day AS day, CAST(roas_m11 AS FLOAT64) AS value, roas_m11_is_predicted AS is_predicted)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS roas_m11_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d1 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d1 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d7 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d7 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d7_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d7_d1 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d7_d1 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d7_d1_visualization,
            TO_JSON_STRING(ARRAY_REVERSE(ARRAY_AGG(IF(retention_d30_d7 IS NULL, NULL, STRUCT(day AS day, CAST(retention_d30_d7 AS FLOAT64) AS value)) IGNORE NULLS ORDER BY day DESC LIMIT 30))) AS retention_d30_d7_visualization
          FROM totals_install_daily
        ), daily_d1 AS (
          SELECT b.* REPLACE(
            IF(b.model = 'hidden_object' AND b.day >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) AND b.rev_d0 > 0 AND f.d1_from_d0 IS NOT NULL, b.rev_d0 * f.d1_from_d0, b.rev_d1) AS rev_d1
          ), IF(b.model = 'hidden_object' AND b.day >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) AND b.rev_d0 > 0 AND f.d1_from_d0 IS NOT NULL, 1, 0) AS flag_d1
          FROM daily_forecast_base b LEFT JOIN hidden_object_d1_factors f USING (calibration_1, calibration_2, forecast_app)
        ), daily_d3 AS (
          SELECT b.* REPLACE(
            IF(b.model = 'hidden_object' AND (b.cohort_age > 1 OR b.flag_d1 = 1) AND b.cohort_age <= 3 AND f.d3_from_d1 IS NOT NULL, b.rev_d1 * f.d3_from_d1 * SAFE_DIVIDE(b.rev_d1, b.rev_d0), b.rev_d3) AS rev_d3
          ), IF(b.model = 'hidden_object' AND (b.cohort_age > 1 OR b.flag_d1 = 1) AND b.cohort_age <= 3 AND f.d3_from_d1 IS NOT NULL, 1, 0) AS flag_d3
          FROM daily_d1 b LEFT JOIN hidden_object_d3_factors f USING (calibration_1, calibration_2, forecast_app)
        ), daily_d7 AS (
          SELECT b.* REPLACE(
            IF(b.model = 'hidden_object' AND (b.cohort_age > 3 OR b.flag_d3 = 1) AND b.cohort_age <= 7 AND f.d7_from_d3 IS NOT NULL, b.rev_d3 * f.d7_from_d3, b.rev_d7) AS rev_d7
          ), IF(b.model = 'hidden_object' AND (b.cohort_age > 3 OR b.flag_d3 = 1) AND b.cohort_age <= 7 AND f.d7_from_d3 IS NOT NULL, 1, 0) AS flag_d7
          FROM daily_d3 b LEFT JOIN hidden_object_d7_factors f USING (calibration_1, calibration_2, forecast_app)
        ), daily_d14 AS (
          SELECT b.* REPLACE(
            IF(
              b.model = 'hidden_object'
              AND (b.cohort_age > 7 OR b.flag_d7 = 1) AND b.cohort_age <= 14 AND f.d14_from_d7 IS NOT NULL,
              b.rev_d7 * f.d14_from_d7 * SAFE_DIVIDE(b.rev_d7, b.rev_d1),
              b.rev_d14
            ) AS rev_d14
          ), IF(
              b.model = 'hidden_object'
              AND (b.cohort_age > 7 OR b.flag_d7 = 1) AND b.cohort_age <= 14 AND f.d14_from_d7 IS NOT NULL, 1, 0) AS flag_d14
          FROM daily_d7 b
          LEFT JOIN hidden_object_d14_factors f USING (calibration_1, calibration_2, forecast_app)

        ), daily_d30 AS (
          SELECT b.* REPLACE(
            IF(
              b.model = 'hidden_object'
              AND (b.cohort_age > 14 OR b.flag_d14 = 1) AND b.cohort_age <= 30 AND f.d30_from_d14 IS NOT NULL,
              b.rev_d14 * f.d30_from_d14,
              b.rev_d30
            ) AS rev_d30
          ), IF(
              b.model = 'hidden_object'
              AND (b.cohort_age > 14 OR b.flag_d14 = 1) AND b.cohort_age <= 30 AND f.d30_from_d14 IS NOT NULL, 1, 0) AS flag_d30,
             IF(
              b.model = 'hidden_object'
              AND (b.cohort_age > 14 OR b.flag_d14 = 1) AND b.cohort_age <= 30 AND f.d30_from_d14 IS NOT NULL,
              f.hidden_object_x,
              NULL
             ) AS hidden_object_x
          FROM daily_d14 b
          LEFT JOIN hidden_object_factors f USING (calibration_1, calibration_2, forecast_app)

        ), daily_forecast_rollup AS (
          SELECT breakdown_1, breakdown_2,
            COUNT(DISTINCT IF(cohort_age > 1 OR flag_d1 = 1, day, NULL)) AS forecast_available_d1_days,
            COUNT(DISTINCT IF(cohort_age > 3 OR flag_d3 = 1, day, NULL)) AS forecast_available_d3_days,
            COUNT(DISTINCT IF(cohort_age > 7 OR flag_d7 = 1, day, NULL)) AS forecast_available_d7_days,
            COUNT(DISTINCT IF(cohort_age > 14 OR flag_d14 = 1, day, NULL)) AS forecast_available_d14_days,
            COUNT(DISTINCT IF(cohort_age > 30 OR flag_d30 = 1, day, NULL)) AS forecast_available_d30_days,
            COUNT(DISTINCT IF(cohort_age > 360 OR flag_m11 = 1 OR flag_d30 = 1, day, NULL)) AS forecast_available_m11_days,
            SUM(rev_d1) AS rev_d1, SUM(rev_d3) AS rev_d3, SUM(rev_d7) AS rev_d7, SUM(rev_d14) AS rev_d14, SUM(rev_d30) AS rev_d30,
            SUM(IF(model = 'hidden_object' AND (flag_m11 = 1 OR flag_d30 = 1), cost * SAFE_DIVIDE(rev_d30, cost) * COALESCE(hidden_object_x, CASE WHEN SAFE_DIVIDE(ret_d30, ret_d7) < 0.35 THEN 0.98 WHEN SAFE_DIVIDE(ret_d30, ret_d7) > 0.35 THEN 1.03 ELSE 1.00 END) * SAFE_DIVIDE(rev_d30, rev_d7), rev_m11)) AS rev_m11,
            MAX(flag_d1) AS flag_d1, MAX(flag_d3) AS flag_d3, MAX(flag_d7) AS flag_d7, MAX(flag_d14) AS flag_d14, MAX(flag_d30) AS flag_d30,
            MAX(IF(flag_m11 = 1 OR flag_d30 = 1, 1, 0)) AS flag_m11
          FROM daily_d30
          GROUP BY breakdown_1, breakdown_2
        ), aggregated AS (
          SELECT
            breakdown_1,
            breakdown_2,
            '(all)' AS forecast_app,
            calibration_1,
            calibration_2,
            MAX(model) AS model,
            IF(
              '{{ filters.breakdown }}' = 'Day',
              DATE_DIFF(CURRENT_DATE(), MIN(day), DAY) - 1,
              SAFE_DIVIDE(
                SUM(installs * (DATE_DIFF(CURRENT_DATE(), day, DAY) - 1)),
                SUM(installs)
              )
            ) AS roas_day,
            COUNT(DISTINCT day) AS days_in_bucket,
            COUNT(DISTINCT IF(cohort_age > 1, day, NULL)) AS mature_d1_days,
            COUNT(DISTINCT IF(cohort_age > 3, day, NULL)) AS mature_d3_days,
            COUNT(DISTINCT IF(cohort_age > 7, day, NULL)) AS mature_d7_days,
            COUNT(DISTINCT IF(cohort_age > 14, day, NULL)) AS mature_d14_days,
            COUNT(DISTINCT IF(cohort_age > 30, day, NULL)) AS mature_d30_days,
            COUNT(DISTINCT IF(cohort_age > 45, day, NULL)) AS mature_d45_days,
            COUNT(DISTINCT IF(cohort_age > 60, day, NULL)) AS mature_d60_days,
            COUNT(DISTINCT IF(cohort_age > 90, day, NULL)) AS mature_d90_days,
            COUNT(DISTINCT IF(cohort_age > 120, day, NULL)) AS mature_d120_days,
            COUNT(DISTINCT IF(cohort_age > 150, day, NULL)) AS mature_m4_days,
            COUNT(DISTINCT IF(cohort_age > 180, day, NULL)) AS mature_m5_days,
            COUNT(DISTINCT IF(cohort_age > 210, day, NULL)) AS mature_m6_days,
            COUNT(DISTINCT IF(cohort_age > 240, day, NULL)) AS mature_m7_days,
            COUNT(DISTINCT IF(cohort_age > 270, day, NULL)) AS mature_m8_days,
            COUNT(DISTINCT IF(cohort_age > 300, day, NULL)) AS mature_m9_days,
            COUNT(DISTINCT IF(cohort_age > 330, day, NULL)) AS mature_m10_days,
            COUNT(DISTINCT IF(cohort_age > 360, day, NULL)) AS mature_m11_days,
            COUNT(DISTINCT IF(cohort_age > 1 AND retained_users_d1 IS NOT NULL, day, NULL)) AS mature_ret_d1_days,
            COUNT(DISTINCT IF(cohort_age > 3 AND retained_users_d3 IS NOT NULL, day, NULL)) AS mature_ret_d3_days,
            COUNT(DISTINCT IF(cohort_age > 7 AND retained_users_d7 IS NOT NULL, day, NULL)) AS mature_ret_d7_days,
            COUNT(DISTINCT IF(cohort_age > 14 AND retained_users_d14 IS NOT NULL, day, NULL)) AS mature_ret_d14_days,
            COUNT(DISTINCT IF(cohort_age > 30 AND retained_users_d30 IS NOT NULL, day, NULL)) AS mature_ret_d30_days,
            COUNT(DISTINCT IF(cohort_age > 60 AND retained_users_d60 IS NOT NULL, day, NULL)) AS mature_ret_d60_days,
            COUNT(DISTINCT IF(cohort_age > 90 AND retained_users_d90 IS NOT NULL, day, NULL)) AS mature_ret_d90_days,
            COUNT(DISTINCT IF(cohort_age > 120 AND retained_users_d120 IS NOT NULL, day, NULL)) AS mature_ret_d120_days,
            SUM(daus) AS total_dau,
            SUM(installs) AS total_installs,
            SUM(sessions) AS total_sessions,
            SUM(all_revenue) AS total_revenue,
            SUM(cost) AS total_cost,
            SUM(cohort_all_revenue) AS cohort_all_revenue,
            SUM(time_spent_d7) AS total_time_spent_d7,
            SUM(time_spent_d30) AS total_time_spent_d30,
            SUM(inter_impression_events) AS total_inter,
            SUM(rewarded_impression_events) AS total_rewarded,
            SUM(purchase_events) AS total_purchase_events,
            SUM(purchase_revenue) AS total_purchase_revenue,
            SUM(all_revenue_total_d0) AS rev_d0,
            SUM(CASE WHEN '{{ filters.breakdown }}' IN ('Week', 'Month', 'Day') AND channel = 'Organic' AND store_type = 'google_play' THEN installs END) AS organic_play_installs,
            SUM(CASE WHEN '{{ filters.breakdown }}' IN ('Week', 'Month', 'Day') AND store_type = 'app_store' THEN installs - skad_installs END) AS organic_appstore_installs,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN all_revenue_total_d1 END) AS rev_d1,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d1 THEN cost END) AS cost_d1,
            MAX(IF(pred_d1, 1, 0)) AS flag_d1,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d3 THEN all_revenue_total_d3 END) AS rev_d3,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d3 THEN cost END) AS cost_d3,
            MAX(IF(pred_d3, 1, 0)) AS flag_d3,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN all_revenue_total_d7 END) AS rev_d7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d7 THEN cost END) AS cost_d7,
            MAX(IF(pred_d7, 1, 0)) AS flag_d7,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d14 THEN all_revenue_total_d14 END) AS rev_d14,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d14 THEN cost END) AS cost_d14,
            MAX(IF(pred_d14, 1, 0)) AS flag_d14,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN all_revenue_total_d30 END) AS rev_d30,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d30 THEN cost END) AS cost_d30,
            MAX(IF(pred_d30, 1, 0)) AS flag_d30,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d45 THEN all_revenue_total_d45 END) AS rev_d45,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_d45 THEN cost END) AS cost_d45,
            MAX(IF(pred_d45, 1, 0)) AS flag_d45,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d60 THEN all_revenue_total_d60 END) AS rev_d60,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d60 THEN cost END) AS cost_d60,
            MAX(IF(pred_d60 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_d60,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d90 THEN all_revenue_total_d90 END) AS rev_d90,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d90 THEN cost END) AS cost_d90,
            MAX(IF(pred_d90 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_d90,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d120 THEN all_revenue_total_d120 END) AS rev_d120,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_d120 THEN cost END) AS cost_d120,
            MAX(IF(pred_d120 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_d120,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m4 THEN all_revenue_total_m4 END) AS rev_m4,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m4 THEN cost END) AS cost_m4,
            MAX(IF(pred_m4 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m4,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m5 THEN all_revenue_total_m5 END) AS rev_m5,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m5 THEN cost END) AS cost_m5,
            MAX(IF(pred_m5 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m5,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m6 THEN all_revenue_total_m6 END) AS rev_m6,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m6 THEN cost END) AS cost_m6,
            MAX(IF(pred_m6 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m6,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m7 THEN all_revenue_total_m7 END) AS rev_m7,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m7 THEN cost END) AS cost_m7,
            MAX(IF(pred_m7 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m7,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m8 THEN all_revenue_total_m8 END) AS rev_m8,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m8 THEN cost END) AS cost_m8,
            MAX(IF(pred_m8 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m8,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m9 THEN all_revenue_total_m9 END) AS rev_m9,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m9 THEN cost END) AS cost_m9,
            MAX(IF(pred_m9 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m9,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m10 THEN all_revenue_total_m10 END) AS rev_m10,
            SUM(CASE WHEN ('{{ filters.prediction_model }}' != 'Hidden Object' AND '{{ filters.show_predictions }}' = 'Yes') OR NOT pred_m10 THEN cost END) AS cost_m10,
            MAX(IF(pred_m10 AND '{{ filters.prediction_model }}' != 'Hidden Object', 1, 0)) AS flag_m10,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN all_revenue_total_m11 END) AS rev_m11,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m11 THEN cost END) AS cost_m11,
            MAX(IF(pred_m11, 1, 0)) AS flag_m11,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m5 THEN multiplier_m11 END) AS rev_m11_mult,
            SUM(CASE WHEN '{{ filters.show_predictions }}' = 'Yes' OR NOT pred_m5 THEN cost END) AS cost_m11_mult,
            SUM(CASE WHEN cohort_age > 1 THEN retained_users_d1 END) AS ret_d1,
            SUM(CASE WHEN cohort_age > 3 THEN retained_users_d3 END) AS ret_d3,
            SUM(CASE WHEN cohort_age > 7 THEN retained_users_d7 END) AS ret_d7,
            SUM(CASE WHEN cohort_age > 14 THEN retained_users_d14 END) AS ret_d14,
            SUM(CASE WHEN cohort_age > 30 THEN retained_users_d30 END) AS ret_d30,
            SUM(CASE WHEN cohort_age > 60 THEN retained_users_d60 END) AS ret_d60,
            SUM(CASE WHEN cohort_age > 90 THEN retained_users_d90 END) AS ret_d90,
            SUM(CASE WHEN cohort_age > 120 THEN retained_users_d120 END) AS ret_d120,
            SUM(IF(channel = 'Applovin', cost, NULL)) AS applovin_cost,
            SUM(IF(channel = 'Google Ads', cost, NULL)) AS google_ads_cost,
            SUM(IF(channel = 'Facebook', cost, NULL)) AS facebook_cost,
            SUM(IF(channel = 'Unity Ads', cost, NULL)) AS unity_cost,
            SUM(IF(channel = 'Mintegral', cost, NULL)) AS mintegral_cost,
            SUM(IF(channel = 'TikTok for Business', cost, NULL)) AS tiktok_cost,
            SUM(IF(channel = 'Apple', cost, NULL)) AS search_ads_cost
          FROM labeled
          WHERE day BETWEEN DATE('{{ filters.date_range.start }}') AND DATE('{{ filters.date_range.end }}')
            {% if filters.day %}AND day IN ({% for selected_day in filters.day %}DATE({{ selected_day | tojson }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
          GROUP BY breakdown_1, breakdown_2, calibration_1, calibration_2
        ), hidden_object_d1 AS (
          SELECT
            a.* REPLACE(
              CASE
                WHEN a.model = 'hidden_object'
                 AND '{{ filters.breakdown }}' = 'Day'
                 AND SAFE_CAST(a.breakdown_1 AS DATE) >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
                 AND a.rev_d0 > 0
                 AND f.d1_from_d0 IS NOT NULL
                THEN a.rev_d0 * f.d1_from_d0
                ELSE a.rev_d1
              END AS rev_d1,
              CASE
                WHEN a.model = 'hidden_object'
                 AND '{{ filters.breakdown }}' = 'Day'
                 AND SAFE_CAST(a.breakdown_1 AS DATE) >= DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
                 AND a.rev_d0 > 0
                 AND f.d1_from_d0 IS NOT NULL
                THEN 1 ELSE a.flag_d1
              END AS flag_d1
            )
          FROM aggregated a
          LEFT JOIN hidden_object_d1_factors f
            ON f.calibration_1 = a.calibration_1
           AND f.calibration_2 = a.calibration_2
        ), hidden_object_d3 AS (
          SELECT
            a.* REPLACE(
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d1_days = a.days_in_bucket OR a.flag_d1 = 1)
                 AND a.mature_d3_days = 0
                 AND f.d3_from_d1 IS NOT NULL
                THEN a.rev_d1 * f.d3_from_d1 * SAFE_DIVIDE(a.rev_d1, a.rev_d0)
                ELSE a.rev_d3
              END AS rev_d3,
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d1_days = a.days_in_bucket OR a.flag_d1 = 1)
                 AND a.mature_d3_days = 0
                 AND f.d3_from_d1 IS NOT NULL
                THEN 1 ELSE a.flag_d3
              END AS flag_d3
            )
          FROM hidden_object_d1 a
          LEFT JOIN hidden_object_d3_factors f
            ON f.calibration_1 = a.calibration_1
           AND f.calibration_2 = a.calibration_2
        ), hidden_object_d7 AS (
          SELECT
            a.* REPLACE(
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d3_days = a.days_in_bucket OR a.flag_d3 = 1)
                 AND a.mature_d7_days = 0
                 AND f.d7_from_d3 IS NOT NULL
                THEN a.rev_d3 * f.d7_from_d3
                ELSE a.rev_d7
              END AS rev_d7,
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d3_days = a.days_in_bucket OR a.flag_d3 = 1)
                 AND a.mature_d7_days = 0
                 AND f.d7_from_d3 IS NOT NULL
                THEN 1 ELSE a.flag_d7
              END AS flag_d7
            )
          FROM hidden_object_d3 a
          LEFT JOIN hidden_object_d7_factors f
            ON f.calibration_1 = a.calibration_1
           AND f.calibration_2 = a.calibration_2
        ), hidden_object_d14 AS (
          SELECT
            a.* REPLACE(
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d7_days = a.days_in_bucket OR a.flag_d7 = 1)
                 AND a.mature_d14_days = 0
                 AND f.d14_from_d7 IS NOT NULL
                THEN a.rev_d7 * f.d14_from_d7 * SAFE_DIVIDE(a.rev_d7, a.rev_d1)
                ELSE a.rev_d14
              END AS rev_d14,
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d7_days = a.days_in_bucket OR a.flag_d7 = 1)
                 AND a.mature_d14_days = 0
                 AND f.d14_from_d7 IS NOT NULL
                THEN 1 ELSE a.flag_d14
              END AS flag_d14
            )
          FROM hidden_object_d7 a
          LEFT JOIN hidden_object_d14_factors f
            ON f.calibration_1 = a.calibration_1
           AND f.calibration_2 = a.calibration_2
        ), hidden_object_d30 AS (
          SELECT
            a.* REPLACE(
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d14_days = a.days_in_bucket OR a.flag_d14 = 1)
                 AND a.mature_d30_days = 0
                 AND f.d30_from_d14 IS NOT NULL
                THEN a.rev_d14 * f.d30_from_d14
                ELSE a.rev_d30
              END AS rev_d30,
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d14_days = a.days_in_bucket OR a.flag_d14 = 1)
                 AND a.mature_d30_days = 0
                 AND f.d30_from_d14 IS NOT NULL
                THEN 1 ELSE a.flag_d30
              END AS flag_d30,
              CASE
                WHEN a.model = 'hidden_object'
                 AND (a.mature_d14_days = a.days_in_bucket OR a.flag_d14 = 1)
                 AND a.mature_d30_days = 0
                 AND f.d30_from_d14 IS NOT NULL
                THEN 1 ELSE a.flag_m11
              END AS flag_m11
            ),
            CASE
              WHEN a.model = 'hidden_object'
               AND (a.mature_d14_days = a.days_in_bucket OR a.flag_d14 = 1)
               AND a.mature_d30_days = 0
               AND f.d30_from_d14 IS NOT NULL
              THEN f.hidden_object_x
            END AS hidden_object_x
          FROM hidden_object_d14 a
          LEFT JOIN hidden_object_factors f
            ON f.calibration_1 = a.calibration_1
           AND f.calibration_2 = a.calibration_2
        ), forecast_aggregated AS (
          SELECT a.* REPLACE(
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_d1, a.rev_d1) AS rev_d1,
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_d3, a.rev_d3) AS rev_d3,
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_d7, a.rev_d7) AS rev_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_d14, a.rev_d14) AS rev_d14,
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_d30, a.rev_d30) AS rev_d30,
            IF('{{ filters.show_predictions }}' = 'Yes', r.rev_m11, a.rev_m11) AS rev_m11,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_d1, a.flag_d1) AS flag_d1,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_d3, a.flag_d3) AS flag_d3,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_d7, a.flag_d7) AS flag_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_d14, a.flag_d14) AS flag_d14,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_d30, a.flag_d30) AS flag_d30,
            IF('{{ filters.show_predictions }}' = 'Yes', r.flag_m11, a.flag_m11) AS flag_m11
          ),
            COALESCE(r.forecast_available_d1_days, a.mature_d1_days) AS forecast_available_d1_days,
            COALESCE(r.forecast_available_d3_days, a.mature_d3_days) AS forecast_available_d3_days,
            COALESCE(r.forecast_available_d7_days, a.mature_d7_days) AS forecast_available_d7_days,
            COALESCE(r.forecast_available_d14_days, a.mature_d14_days) AS forecast_available_d14_days,
            COALESCE(r.forecast_available_d30_days, a.mature_d30_days) AS forecast_available_d30_days,
            COALESCE(r.forecast_available_m11_days, a.mature_m11_days) AS forecast_available_m11_days
          FROM aggregated a
          LEFT JOIN daily_forecast_rollup r
            ON r.breakdown_1 = a.breakdown_1
           AND r.breakdown_2 IS NOT DISTINCT FROM a.breakdown_2
        ), forecast_with_install_visualization AS (
          SELECT
            a.*,
            v.install_visualization,
            v.cost_visualization,
            v.roas_d1_visualization,
            v.roas_d7_visualization,
            v.roas_d30_visualization,
            v.roas_d7_d1_visualization,
            v.roas_d30_d7_visualization,
            v.roas_m11_visualization,
            v.retention_d1_visualization,
            v.retention_d7_visualization,
            v.retention_d7_d1_visualization,
            v.retention_d30_d7_visualization
          FROM forecast_aggregated a
          LEFT JOIN install_visualization v
            ON v.breakdown_1 = a.breakdown_1
           AND v.breakdown_2 IS NOT DISTINCT FROM a.breakdown_2
        ), calculated AS (
          SELECT
            0 AS total_row_style,
            breakdown_1,
            breakdown_2,
            model,
            roas_day,
            days_in_bucket,
            mature_d1_days, mature_d3_days, mature_d7_days, mature_d14_days,
            mature_d30_days, mature_d45_days, mature_d60_days, mature_d90_days, mature_d120_days,
            mature_m4_days, mature_m5_days, mature_m6_days, mature_m7_days,
            mature_m8_days, mature_m9_days, mature_m10_days, mature_m11_days,
            forecast_available_d1_days, forecast_available_d3_days, forecast_available_d7_days,
            forecast_available_d14_days, forecast_available_d30_days, forecast_available_m11_days,
            mature_ret_d1_days, mature_ret_d3_days, mature_ret_d7_days, mature_ret_d14_days,
            mature_ret_d30_days, mature_ret_d60_days, mature_ret_d90_days, mature_ret_d120_days,
            total_revenue,
            total_cost AS total_spend,
            cost_visualization,
            total_revenue - total_cost AS profit,
            IF('{{ filters.breakdown }}' IN ('Week', 'Month'), SAFE_DIVIDE(total_dau, days_in_bucket), CAST(total_dau AS FLOAT64)) AS dau,
            total_installs AS installs,
            install_visualization,
            SAFE_DIVIDE(total_cost, total_installs) AS cpi,
            SAFE_DIVIDE(total_revenue, total_dau) AS arpdau,
            SAFE_DIVIDE(rev_d0, total_cost) AS roas_d0,
            SAFE_DIVIDE(rev_d1, cost_d1) AS roas_d1,
            roas_d1_visualization,
            SAFE_DIVIDE(rev_d3, cost_d3) AS roas_d3,
            SAFE_DIVIDE(rev_d7, cost_d7) AS roas_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', SAFE_DIVIDE(1.20, SAFE_DIVIDE(rev_m11, rev_d7)), NULL) AS target_roas_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', SAFE_DIVIDE(1.20, SAFE_DIVIDE(rev_m11, rev_d7)), NULL) AS target_roas_d7_reference,
            roas_d7_visualization,
            SAFE_DIVIDE(rev_d14, cost_d14) AS roas_d14,
            SAFE_DIVIDE(rev_d30, cost_d30) AS roas_d30,
            roas_d30_visualization,
            SAFE_DIVIDE(rev_d60, cost_d60) AS roas_d60,
            SAFE_DIVIDE(rev_d90, cost_d90) AS roas_d90,
            SAFE_DIVIDE(rev_d120, cost_d120) AS roas_d120,
            SAFE_DIVIDE(rev_m4, cost_m4) AS roas_m4,
            SAFE_DIVIDE(rev_m5, cost_m5) AS roas_m5,
            SAFE_DIVIDE(rev_m6, cost_m6) AS roas_m6,
            SAFE_DIVIDE(rev_m7, cost_m7) AS roas_m7,
            SAFE_DIVIDE(rev_m8, cost_m8) AS roas_m8,
            SAFE_DIVIDE(rev_m9, cost_m9) AS roas_m9,
            SAFE_DIVIDE(rev_m10, cost_m10) AS roas_m10,
            SAFE_DIVIDE(rev_m11, cost_m11) AS roas_m11,
            roas_m11_visualization,
            SAFE_DIVIDE(rev_m11_mult, cost_m11_mult) AS roas_m11_mult,
            SAFE_DIVIDE(cohort_all_revenue, total_cost) AS all_roas,
            SAFE_DIVIDE(rev_d1, rev_d0) AS roas_d1_d0,
            SAFE_DIVIDE(rev_d3, rev_d1) AS roas_d3_d1,
            SAFE_DIVIDE(rev_d7, rev_d1) AS roas_d7_d1,
            roas_d7_d1_visualization,
            SAFE_DIVIDE(rev_d14, rev_d7) AS roas_d14_d7,
            SAFE_DIVIDE(rev_d30, rev_d7) AS roas_d30_d7,
            roas_d30_d7_visualization,
            SAFE_DIVIDE(rev_d45, rev_d30) AS roas_d45_d30,
            SAFE_DIVIDE(rev_d60, rev_d30) AS roas_d60_d30,
            SAFE_DIVIDE(rev_d120, rev_d7) AS roas_d120_d7,
            SAFE_DIVIDE(rev_m5, rev_d30) AS roas_d180_d30,
            SAFE_DIVIDE(rev_m11, rev_d30) AS roas_d360_d30,
            SAFE_DIVIDE(rev_m11, rev_d120) AS roas_d360_d120,
            SAFE_DIVIDE(rev_d14, rev_d1) AS roas_d14_d1,
            SAFE_DIVIDE(ret_d1, total_installs) AS retention_d1,
            retention_d1_visualization,
            SAFE_DIVIDE(NULLIF(ret_d3, 0), total_installs) AS retention_d3,
            SAFE_DIVIDE(NULLIF(ret_d7, 0), total_installs) AS retention_d7,
            retention_d7_visualization,
            SAFE_DIVIDE(NULLIF(ret_d14, 0), total_installs) AS retention_d14,
            SAFE_DIVIDE(NULLIF(ret_d30, 0), total_installs) AS retention_d30,
            SAFE_DIVIDE(NULLIF(ret_d60, 0), total_installs) AS retention_d60,
            SAFE_DIVIDE(NULLIF(ret_d90, 0), total_installs) AS retention_d90,
            SAFE_DIVIDE(NULLIF(ret_d120, 0), total_installs) AS retention_d120,
            SAFE_DIVIDE(NULLIF(ret_d3, 0), NULLIF(ret_d1, 0)) AS retention_d3_d1,
            SAFE_DIVIDE(NULLIF(ret_d7, 0), NULLIF(ret_d1, 0)) AS retention_d7_d1,
            retention_d7_d1_visualization,
            SAFE_DIVIDE(NULLIF(ret_d30, 0), NULLIF(ret_d7, 0)) AS retention_d30_d7,
            retention_d30_d7_visualization,
            SAFE_DIVIDE(NULLIF(ret_d120, 0), NULLIF(ret_d7, 0)) AS retention_d120_d7,
            SAFE_DIVIDE(SAFE_DIVIDE(total_time_spent_d7, ret_d7), 60) AS daily_time_spent_d7,
            SAFE_DIVIDE(SAFE_DIVIDE(total_time_spent_d30, ret_d30), 60) AS daily_time_spent_d30,
            SAFE_DIVIDE(total_sessions, total_dau) AS sessions_per_dau,
            total_inter AS inter_impression_events,
            SAFE_DIVIDE(total_inter, total_dau) AS inter_per_dau,
            SAFE_DIVIDE(total_inter, total_sessions) AS inter_per_session,
            total_rewarded AS rewarded_impression_events,
            SAFE_DIVIDE(total_rewarded, total_dau) AS rewarded_per_dau,
            SAFE_DIVIDE(total_rewarded, total_sessions) AS rewarded_per_session,
            total_purchase_events AS purchase_events,
            SAFE_DIVIDE(total_purchase_revenue, total_purchase_events) AS inapp_unit_revenue,
            SAFE_DIVIDE(total_purchase_revenue, total_dau) AS inapp_per_dau,
            total_purchase_revenue AS inapp_revenue,
            applovin_cost,
            google_ads_cost,
            facebook_cost,
            unity_cost,
            mintegral_cost,
            tiktok_cost,
            search_ads_cost,
            organic_play_installs AS android_organic_installs,
            SAFE_DIVIDE(organic_play_installs, total_installs) AS android_organic_installs_rate,
            organic_appstore_installs AS ios_organic_installs,
            SAFE_DIVIDE(organic_appstore_installs, total_installs) AS ios_organic_installs_rate,
            SAFE_DIVIDE(total_installs, total_dau) AS dnu_per_dau,
            SAFE_DIVIDE(total_revenue - total_cost, total_cost) AS roi,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d1, 0) AS roas_d1_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d3, 0) AS roas_d3_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d7, 0) AS roas_d7_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d14, 0) AS roas_d14_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d30, 0) AS roas_d30_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d60, 0) AS roas_d60_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d90, 0) AS roas_d90_prediction,
            0 AS roas_d120_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m4, 0) AS roas_m4_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m5, 0) AS roas_m5_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m6, 0) AS roas_m6_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m7, 0) AS roas_m7_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m8, 0) AS roas_m8_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m9, 0) AS roas_m9_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m10, 0) AS roas_m10_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m11, 0) AS roas_m11_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m5, 0) AS roas_m11_mult_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_d1, 0) AS roas_d1_d0_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d3, flag_d1), 0) AS roas_d3_d1_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d7, flag_d1), 0) AS roas_d7_d1_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d14, flag_d7), 0) AS roas_d14_d7_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d30, flag_d7), 0) AS roas_d30_d7_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d45, flag_d30), 0) AS roas_d45_d30_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_d60, flag_d30), 0) AS roas_d60_d30_prediction,
            0 AS roas_d120_d7_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_m5, flag_d30), 0) AS roas_d180_d30_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', GREATEST(flag_m11, flag_d30), 0) AS roas_d360_d30_prediction,
            IF('{{ filters.show_predictions }}' = 'Yes', flag_m11, 0) AS roas_d360_d120_prediction
          FROM forecast_with_install_visualization
        )
        , totals AS (
          SELECT
            1 AS total_row_style,
            'Totals' AS breakdown_1,
            CAST(NULL AS STRING) AS breakdown_2,
            MAX(model) AS model,
            CAST(NULL AS INT64) AS roas_day,
            CAST(NULL AS INT64) AS days_in_bucket,
            SUM(mature_d1_days) AS mature_d1_days,
            SUM(mature_d3_days) AS mature_d3_days,
            SUM(mature_d7_days) AS mature_d7_days,
            SUM(mature_d14_days) AS mature_d14_days,
            SUM(mature_d30_days) AS mature_d30_days,
            SUM(mature_d45_days) AS mature_d45_days,
            SUM(mature_d60_days) AS mature_d60_days,
            SUM(mature_d90_days) AS mature_d90_days,
            SUM(mature_d120_days) AS mature_d120_days,
            SUM(mature_m4_days) AS mature_m4_days,
            SUM(mature_m5_days) AS mature_m5_days,
            SUM(mature_m6_days) AS mature_m6_days,
            SUM(mature_m7_days) AS mature_m7_days,
            SUM(mature_m8_days) AS mature_m8_days,
            SUM(mature_m9_days) AS mature_m9_days,
            SUM(mature_m10_days) AS mature_m10_days,
            SUM(mature_m11_days) AS mature_m11_days,
            CAST(NULL AS INT64) AS forecast_available_d1_days,
            CAST(NULL AS INT64) AS forecast_available_d3_days,
            CAST(NULL AS INT64) AS forecast_available_d7_days,
            CAST(NULL AS INT64) AS forecast_available_d14_days,
            CAST(NULL AS INT64) AS forecast_available_d30_days,
            CAST(NULL AS INT64) AS forecast_available_m11_days,
            SUM(mature_ret_d1_days) AS mature_ret_d1_days,
            SUM(mature_ret_d3_days) AS mature_ret_d3_days,
            SUM(mature_ret_d7_days) AS mature_ret_d7_days,
            SUM(mature_ret_d14_days) AS mature_ret_d14_days,
            SUM(mature_ret_d30_days) AS mature_ret_d30_days,
            SUM(mature_ret_d60_days) AS mature_ret_d60_days,
            SUM(mature_ret_d90_days) AS mature_ret_d90_days,
            SUM(mature_ret_d120_days) AS mature_ret_d120_days,
            SUM(total_revenue) AS total_revenue,
            SUM(total_cost) AS total_spend,
            ANY_VALUE(v.cost_visualization) AS cost_visualization,
            SUM(total_revenue) - SUM(total_cost) AS profit,
            SAFE_DIVIDE(SUM(total_dau), (SELECT COUNT(DISTINCT day) FROM labeled
              {% if filters.day %}
              WHERE day BETWEEN DATE('{{ filters.date_range.start }}') AND DATE('{{ filters.date_range.end }}')
            {% if filters.day %}AND day IN ({% for selected_day in filters.day %}DATE({{ selected_day | tojson }}){% if not loop.last %}, {% endif %}{% endfor %}){% endif %}
              {% endif %}
            )) AS dau,
            SUM(total_installs) AS installs,
            ANY_VALUE(v.install_visualization) AS install_visualization,
            SAFE_DIVIDE(SUM(total_cost), SUM(IF(COALESCE(total_cost, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS cpi,
            SAFE_DIVIDE(SUM(total_revenue), SUM(IF(COALESCE(total_revenue, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS arpdau,
            SAFE_DIVIDE(SUM(rev_d0), SUM(total_cost)) AS roas_d0,
            SAFE_DIVIDE(SUM(rev_d1), SUM(cost_d1)) AS roas_d1,
            ANY_VALUE(v.roas_d1_visualization) AS roas_d1_visualization,
            SAFE_DIVIDE(SUM(rev_d3), SUM(cost_d3)) AS roas_d3,
            SAFE_DIVIDE(SUM(rev_d7), SUM(cost_d7)) AS roas_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', SAFE_DIVIDE(1.20, SAFE_DIVIDE(SUM(rev_m11), SUM(rev_d7))), NULL) AS target_roas_d7,
            IF('{{ filters.show_predictions }}' = 'Yes', SAFE_DIVIDE(1.20, SAFE_DIVIDE(SUM(rev_m11), SUM(rev_d7))), NULL) AS target_roas_d7_reference,
            ANY_VALUE(v.roas_d7_visualization) AS roas_d7_visualization,
            SAFE_DIVIDE(SUM(rev_d14), SUM(cost_d14)) AS roas_d14,
            SAFE_DIVIDE(SUM(rev_d30), SUM(cost_d30)) AS roas_d30,
            ANY_VALUE(v.roas_d30_visualization) AS roas_d30_visualization,
            SAFE_DIVIDE(SUM(rev_d60), SUM(cost_d60)) AS roas_d60,
            SAFE_DIVIDE(SUM(rev_d90), SUM(cost_d90)) AS roas_d90,
            SAFE_DIVIDE(SUM(rev_d120), SUM(cost_d120)) AS roas_d120,
            SAFE_DIVIDE(SUM(rev_m4), SUM(cost_m4)) AS roas_m4,
            SAFE_DIVIDE(SUM(rev_m5), SUM(cost_m5)) AS roas_m5,
            SAFE_DIVIDE(SUM(rev_m6), SUM(cost_m6)) AS roas_m6,
            SAFE_DIVIDE(SUM(rev_m7), SUM(cost_m7)) AS roas_m7,
            SAFE_DIVIDE(SUM(rev_m8), SUM(cost_m8)) AS roas_m8,
            SAFE_DIVIDE(SUM(rev_m9), SUM(cost_m9)) AS roas_m9,
            SAFE_DIVIDE(SUM(rev_m10), SUM(cost_m10)) AS roas_m10,
            IF(
              '{{ filters.show_predictions }}' = 'Yes',
              SAFE_DIVIDE(
                SUM(IF(SAFE_DIVIDE(rev_m11, cost_m11) IS NOT NULL AND total_cost > 0,
                       SAFE_DIVIDE(rev_m11, cost_m11) * total_cost,
                       NULL)),
                SUM(IF(SAFE_DIVIDE(rev_m11, cost_m11) IS NOT NULL AND total_cost > 0,
                       total_cost,
                       NULL))
              ),
              SAFE_DIVIDE(SUM(rev_m11), SUM(cost_m11))
            ) AS roas_m11,
            ANY_VALUE(v.roas_m11_visualization) AS roas_m11_visualization,
            SAFE_DIVIDE(SUM(rev_m11_mult), SUM(cost_m11_mult)) AS roas_m11_mult,
            SAFE_DIVIDE(SUM(cohort_all_revenue), SUM(total_cost)) AS all_roas,
            SAFE_DIVIDE(SUM(rev_d1), SUM(rev_d0)) AS roas_d1_d0,
            SAFE_DIVIDE(SUM(rev_d3), SUM(rev_d1)) AS roas_d3_d1,
            SAFE_DIVIDE(SUM(rev_d7), SUM(rev_d1)) AS roas_d7_d1,
            ANY_VALUE(v.roas_d7_d1_visualization) AS roas_d7_d1_visualization,
            SAFE_DIVIDE(SUM(rev_d14), SUM(rev_d7)) AS roas_d14_d7,
            SAFE_DIVIDE(SUM(rev_d30), SUM(rev_d7)) AS roas_d30_d7,
            ANY_VALUE(v.roas_d30_d7_visualization) AS roas_d30_d7_visualization,
            SAFE_DIVIDE(SUM(rev_d45), SUM(rev_d30)) AS roas_d45_d30,
            SAFE_DIVIDE(SUM(rev_d60), SUM(rev_d30)) AS roas_d60_d30,
            SAFE_DIVIDE(SUM(rev_d120), SUM(rev_d7)) AS roas_d120_d7,
            SAFE_DIVIDE(SUM(rev_m5), SUM(rev_d30)) AS roas_d180_d30,
            SAFE_DIVIDE(SUM(rev_m11), SUM(rev_d30)) AS roas_d360_d30,
            SAFE_DIVIDE(SUM(rev_m11), SUM(rev_d120)) AS roas_d360_d120,
            SAFE_DIVIDE(SUM(rev_d14), SUM(rev_d1)) AS roas_d14_d1,
            SAFE_DIVIDE(SUM(ret_d1), SUM(IF(COALESCE(ret_d1, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d1,
            ANY_VALUE(v.retention_d1_visualization) AS retention_d1_visualization,
            SAFE_DIVIDE(SUM(ret_d3), SUM(IF(COALESCE(ret_d3, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d3,
            SAFE_DIVIDE(SUM(ret_d7), SUM(IF(COALESCE(ret_d7, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d7,
            ANY_VALUE(v.retention_d7_visualization) AS retention_d7_visualization,
            SAFE_DIVIDE(SUM(ret_d14), SUM(IF(COALESCE(ret_d14, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d14,
            SAFE_DIVIDE(SUM(ret_d30), SUM(IF(COALESCE(ret_d30, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d30,
            SAFE_DIVIDE(SUM(ret_d60), SUM(IF(COALESCE(ret_d60, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d60,
            SAFE_DIVIDE(SUM(ret_d90), SUM(IF(COALESCE(ret_d90, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d90,
            SAFE_DIVIDE(SUM(ret_d120), SUM(IF(COALESCE(ret_d120, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS retention_d120,
            SAFE_DIVIDE(SUM(ret_d3), SUM(IF(COALESCE(ret_d3, 0) = 0, NULL, NULLIF(ret_d1, 0)))) AS retention_d3_d1,
            SAFE_DIVIDE(SUM(ret_d7), SUM(IF(COALESCE(ret_d7, 0) = 0, NULL, NULLIF(ret_d1, 0)))) AS retention_d7_d1,
            ANY_VALUE(v.retention_d7_d1_visualization) AS retention_d7_d1_visualization,
            SAFE_DIVIDE(SUM(ret_d30), SUM(IF(COALESCE(ret_d30, 0) = 0, NULL, NULLIF(ret_d7, 0)))) AS retention_d30_d7,
            ANY_VALUE(v.retention_d30_d7_visualization) AS retention_d30_d7_visualization,
            SAFE_DIVIDE(SUM(ret_d120), SUM(IF(COALESCE(ret_d120, 0) = 0, NULL, NULLIF(ret_d7, 0)))) AS retention_d120_d7,
            SAFE_DIVIDE(SAFE_DIVIDE(SUM(total_time_spent_d7), SUM(IF(COALESCE(total_time_spent_d7, 0) = 0, NULL, NULLIF(ret_d7, 0)))), 60) AS daily_time_spent_d7,
            SAFE_DIVIDE(SAFE_DIVIDE(SUM(total_time_spent_d30), SUM(IF(COALESCE(total_time_spent_d30, 0) = 0, NULL, NULLIF(ret_d30, 0)))), 60) AS daily_time_spent_d30,
            SAFE_DIVIDE(SUM(total_sessions), SUM(IF(COALESCE(total_sessions, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS sessions_per_dau,
            SUM(total_inter) AS inter_impression_events,
            SAFE_DIVIDE(SUM(total_inter), SUM(IF(COALESCE(total_inter, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS inter_per_dau,
            SAFE_DIVIDE(SUM(total_inter), SUM(IF(COALESCE(total_inter, 0) = 0, NULL, NULLIF(total_sessions, 0)))) AS inter_per_session,
            SUM(total_rewarded) AS rewarded_impression_events,
            SAFE_DIVIDE(SUM(total_rewarded), SUM(IF(COALESCE(total_rewarded, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS rewarded_per_dau,
            SAFE_DIVIDE(SUM(total_rewarded), SUM(IF(COALESCE(total_rewarded, 0) = 0, NULL, NULLIF(total_sessions, 0)))) AS rewarded_per_session,
            SUM(total_purchase_events) AS purchase_events,
            SAFE_DIVIDE(SUM(total_purchase_revenue), SUM(IF(COALESCE(total_purchase_revenue, 0) = 0, NULL, NULLIF(total_purchase_events, 0)))) AS inapp_unit_revenue,
            SAFE_DIVIDE(SUM(total_purchase_revenue), SUM(IF(COALESCE(total_purchase_revenue, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS inapp_per_dau,
            SUM(total_purchase_revenue) AS inapp_revenue,
            SUM(applovin_cost) AS applovin_cost,
            SUM(google_ads_cost) AS google_ads_cost,
            SUM(facebook_cost) AS facebook_cost,
            SUM(unity_cost) AS unity_cost,
            SUM(mintegral_cost) AS mintegral_cost,
            SUM(tiktok_cost) AS tiktok_cost,
            SUM(search_ads_cost) AS search_ads_cost,
            SUM(organic_play_installs) AS android_organic_installs,
            SAFE_DIVIDE(SUM(organic_play_installs), SUM(IF(COALESCE(organic_play_installs, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS android_organic_installs_rate,
            SUM(organic_appstore_installs) AS ios_organic_installs,
            SAFE_DIVIDE(SUM(organic_appstore_installs), SUM(IF(COALESCE(organic_appstore_installs, 0) = 0, NULL, NULLIF(total_installs, 0)))) AS ios_organic_installs_rate,
            SAFE_DIVIDE(SUM(total_installs), SUM(IF(COALESCE(total_installs, 0) = 0, NULL, NULLIF(total_dau, 0)))) AS dnu_per_dau,
            SAFE_DIVIDE(SUM(total_revenue) - SUM(total_cost), SUM(total_cost)) AS roi,
            2 AS roas_d1_prediction,
            2 AS roas_d3_prediction,
            2 AS roas_d7_prediction,
            2 AS roas_d14_prediction,
            2 AS roas_d30_prediction,
            2 AS roas_d60_prediction,
            2 AS roas_d90_prediction,
            2 AS roas_d120_prediction,
            2 AS roas_m4_prediction,
            2 AS roas_m5_prediction,
            2 AS roas_m6_prediction,
            2 AS roas_m7_prediction,
            2 AS roas_m8_prediction,
            2 AS roas_m9_prediction,
            2 AS roas_m10_prediction,
            2 AS roas_m11_prediction,
            2 AS roas_m11_mult_prediction,
            2 AS roas_d1_d0_prediction,
            2 AS roas_d3_d1_prediction,
            2 AS roas_d7_d1_prediction,
            2 AS roas_d14_d7_prediction,
            2 AS roas_d30_d7_prediction,
            2 AS roas_d45_d30_prediction,
            2 AS roas_d60_d30_prediction,
            2 AS roas_d120_d7_prediction,
            2 AS roas_d180_d30_prediction,
            2 AS roas_d360_d30_prediction,
            2 AS roas_d360_d120_prediction
          FROM forecast_aggregated
          CROSS JOIN totals_visualization v
        )
        , maturity_safe AS (
          SELECT * REPLACE(
            IF(
              total_row_style = 0
              AND '{{ filters.breakdown }}' = 'Week'
              AND mature_d120_days BETWEEN 1 AND 6,
              NULL,
              roas_d360_d120
            ) AS roas_d360_d120
          )
          FROM (
            SELECT * FROM calculated
            UNION ALL
            SELECT * FROM totals
          )
        )
        , zebra AS (
          SELECT *,
            CASE
              WHEN total_row_style = 1 THEN 1
              WHEN MOD(ROW_NUMBER() OVER (
                ORDER BY total_row_style,
                  CASE WHEN '{{ filters.breakdown }}' IN ('Channel', 'Country', 'Language Group', 'Country & Store Type', 'Channel & Store Type', 'App', 'Campaign Name & Ad Group') THEN total_spend END DESC NULLS LAST,
                  breakdown_1,
                  breakdown_2
              ), 2) = 1 THEN 2
              ELSE 0
            END AS row_stripe
          FROM (
            SELECT * FROM calculated
            UNION ALL
            SELECT * FROM totals
          )
        ), styled AS (
          SELECT * REPLACE(
              CASE WHEN total_row_style = 1 THEN 4 WHEN roas_d1 IS NULL THEN IF(row_stripe = 2, 2, 0) WHEN roas_d1_prediction = 2 THEN 4 WHEN roas_d1_prediction = 1 THEN 3 WHEN row_stripe = 2 THEN 2 ELSE 0 END AS roas_d1_prediction,
              CASE WHEN total_row_style = 1 THEN 4 WHEN roas_d3 IS NULL THEN IF(row_stripe = 2, 2, 0) WHEN roas_d3_prediction = 2 THEN 4 WHEN roas_d3_prediction = 1 THEN 3 WHEN row_stripe = 2 THEN 2 ELSE 0 END AS roas_d3_prediction,
              CASE
                WHEN '{{ filters.show_predictions }}' = 'Yes'
                 AND roas_d7 IS NOT NULL
                 AND target_roas_d7_reference IS NOT NULL
                THEN CASE
                  WHEN total_row_style = 1 THEN CASE WHEN roas_d7 >= target_roas_d7_reference THEN 43 WHEN roas_d7 > target_roas_d7_reference * 0.875 THEN 42 ELSE 41 END
                  WHEN roas_d7_prediction = 2 THEN CASE WHEN roas_d7 >= target_roas_d7_reference THEN 43 WHEN roas_d7 > target_roas_d7_reference * 0.875 THEN 42 ELSE 41 END
                  WHEN roas_d7_prediction = 1 THEN CASE WHEN roas_d7 >= target_roas_d7_reference THEN 33 WHEN roas_d7 > target_roas_d7_reference * 0.875 THEN 32 ELSE 31 END
                  WHEN row_stripe = 2 THEN CASE WHEN roas_d7 >= target_roas_d7_reference THEN 23 WHEN roas_d7 > target_roas_d7_reference * 0.875 THEN 22 ELSE 21 END
                  ELSE CASE WHEN roas_d7 >= target_roas_d7_reference THEN 13 WHEN roas_d7 > target_roas_d7_reference * 0.875 THEN 12 ELSE 11 END
                END
                ELSE CASE WHEN total_row_style = 1 THEN 4 WHEN roas_d7 IS NULL THEN IF(row_stripe = 2, 2, 0) WHEN roas_d7_prediction = 2 THEN 4 WHEN roas_d7_prediction = 1 THEN 3 WHEN row_stripe = 2 THEN 2 ELSE 0 END
