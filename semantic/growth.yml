            CASE WHEN total_row_style = 0 AND (('{{ filters.breakdown }}' = 'Week' AND mature_ret_d120_days BETWEEN 1 AND 6) OR ('{{ filters.breakdown }}' = 'Month' AND mature_ret_d120_days > 0 AND mature_ret_d120_days < EXTRACT(DAY FROM LAST_DAY(SAFE_CAST(breakdown_1 AS DATE))))) THEN '*' WHEN retention_d120 IS NULL THEN NULL ELSE FORMAT('%.2f%%', retention_d120 * 100) END AS retention_d120_display,
            CASE WHEN total_row_style = 0 AND (('{{ filters.breakdown }}' = 'Week' AND mature_ret_d3_days BETWEEN 1 AND 6) OR ('{{ filters.breakdown }}' = 'Month' AND mature_ret_d3_days > 0 AND mature_ret_d3_days < EXTRACT(DAY FROM LAST_DAY(SAFE_CAST(breakdown_1 AS DATE))))) THEN '*' WHEN retention_d3_d1 IS NULL THEN NULL ELSE FORMAT('%.2f', retention_d3_d1) END AS retention_d3_d1_display,
            CASE WHEN total_row_style = 0 AND (('{{ filters.breakdown }}' = 'Week' AND mature_ret_d7_days BETWEEN 1 AND 6) OR ('{{ filters.breakdown }}' = 'Month' AND mature_ret_d7_days > 0 AND mature_ret_d7_days < EXTRACT(DAY FROM LAST_DAY(SAFE_CAST(breakdown_1 AS DATE))))) THEN '*' WHEN retention_d7_d1 IS NULL THEN NULL ELSE FORMAT('%.2f', retention_d7_d1) END AS retention_d7_d1_display,
            CASE WHEN total_row_style = 0 AND (('{{ filters.breakdown }}' = 'Week' AND mature_ret_d30_days BETWEEN 1 AND 6) OR ('{{ filters.breakdown }}' = 'Month' AND mature_ret_d30_days > 0 AND mature_ret_d30_days < EXTRACT(DAY FROM LAST_DAY(SAFE_CAST(breakdown_1 AS DATE))))) THEN '*' WHEN retention_d30_d7 IS NULL THEN NULL ELSE FORMAT('%.2f', retention_d30_d7) END AS retention_d30_d7_display,
            CASE WHEN total_row_style = 0 AND (('{{ filters.breakdown }}' = 'Week' AND mature_ret_d120_days BETWEEN 1 AND 6) OR ('{{ filters.breakdown }}' = 'Month' AND mature_ret_d120_days > 0 AND mature_ret_d120_days < EXTRACT(DAY FROM LAST_DAY(SAFE_CAST(breakdown_1 AS DATE))))) THEN '*' WHEN retention_d120_d7 IS NULL THEN NULL ELSE FORMAT('%.2f', retention_d120_d7) END AS retention_d120_d7_display
          FROM roas_m11_styled
        )
        SELECT * EXCEPT (
          days_in_bucket,
          mature_d1_days, mature_d3_days, mature_d7_days, mature_d14_days,
          mature_d30_days, mature_d45_days, mature_d60_days, mature_d90_days, mature_d120_days,
          mature_m4_days, mature_m5_days, mature_m6_days, mature_m7_days,
          mature_m8_days, mature_m9_days, mature_m10_days, mature_m11_days,
          forecast_available_d1_days, forecast_available_d3_days, forecast_available_d7_days,
          forecast_available_d14_days, forecast_available_d30_days, forecast_available_m11_days,
          mature_ret_d1_days, mature_ret_d3_days, mature_ret_d7_days,
          mature_ret_d14_days, mature_ret_d30_days, mature_ret_d60_days,
          mature_ret_d90_days, mature_ret_d120_days,
