# Imported from powerbi_demo (3).pbix.
name: powerbi_demo_customers
label: Power BI Demo Customers
description: Customer dimension imported from powerbi_demo (3).pbix. One row per customer.
source:
  table: bruin-playground-bensu.powerbi_demo.customers
primary_key: customer_id
dimensions:
- name: customer_id
  type: string
  label: Customer ID
- name: customer_name
  type: string
  label: Customer name
- name: country
  type: string
- name: segment
  type: string
- name: signup_date
  type: time
  granularities:
    day: DATE_TRUNC(signup_date, DAY)
    month: DATE_TRUNC(signup_date, MONTH)
    quarter: DATE_TRUNC(signup_date, QUARTER)
    year: DATE_TRUNC(signup_date, YEAR)
metrics:
- name: customer_count
  label: Customers
  expression: COUNT(DISTINCT customer_id)
  format:
    type: number
    decimals: 0
