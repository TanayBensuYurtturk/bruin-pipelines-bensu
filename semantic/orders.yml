schema: v1
name: orders
label: Orders
description: Orders model covering string, number, boolean, and time dimensions..
source:
  table: bruin-playground-bensu.analytics.orders
primary_key: order_id

joins:
  - name: customers
    model: customers
    relationship: many_to_one
    foreign_key: customer_id
    target_key: id

dimensions:
  - name: order_id            # number + hidden + group
    type: number
    hidden: true
    group: Keys
  - name: status              # string + label + description
    label: Status
    description: Fulfilment status
    type: string
  - name: amount              # visible number for numeric note scopes
    label: Order Amount
    description: Exact order amount; use segments or query filters for thresholds.
    type: number
  - name: created_at          # time + granularities
    label: Order Date
    description: Order timestamp; notes can describe a single date or a date range on this dimension.
    type: time
    granularities:
      day: timestamp_trunc(created_at, DAY)
      week: timestamp_trunc(created_at, WEEK(MONDAY))
      month: timestamp_trunc(created_at, MONTH)
      quarter: timestamp_trunc(created_at, QUARTER)
      year: timestamp_trunc(created_at, YEAR)
  - name: is_high_value       # boolean + expression
    label: High Value Order
    type: boolean
    expression: amount >= 300

metrics:
  - name: order_count         # expression + group + format.type
    label: Orders
    description: Total orders
    expression: count(*)
    group: Volume
    format:
      type: number
  - name: gross_revenue       # format currency + decimals
    label: Gross Revenue
    expression: sum(amount)
    format:
      type: currency
      currency: USD
      decimals: 0
  - name: avg_order_value     # metric-to-metric references
    label: Avg Order Value
    expression: "{gross_revenue} / {order_count}"
  - name: completed_revenue   # filter + hidden
    expression: sum(amount)
    filter: "status = 'completed'"
    hidden: true
  - name: completed_orders
    label: Completed Orders
    expression: count(*)
    filter: "status = 'completed'"
    group: Volume
    format: { type: number }
  - name: pending_orders
    label: Pending Orders
    expression: count(*)
    filter: "status = 'pending'"
    group: Volume
    format: { type: number }
  - name: cancelled_orders
    label: Cancelled Orders
    expression: count(*)
    filter: "status = 'cancelled'"
    group: Volume
    format: { type: number }
  - name: high_value_orders
    label: High-Value Orders (≥ $300)
    expression: count(*)
    filter: "amount >= 300"
    group: Volume
    format: { type: number }
  - name: unique_customers
    label: Unique Customers
    expression: count(distinct customer_id)
    group: Volume
    format: { type: number }
  - name: cancelled_revenue
    label: Cancelled Revenue
    description: Order value lost to cancellations
    expression: sum(amount)
    filter: "status = 'cancelled'"
    group: Revenue
    format: { type: currency, currency: USD, decimals: 0 }
  - name: max_order_value
    label: Largest Order
    expression: max(amount)
    group: Revenue
    format: { type: currency, currency: USD, decimals: 2 }
  - name: revenue_per_customer
    label: Revenue per Customer
    expression: "SAFE_DIVIDE({gross_revenue}, {unique_customers})"
    group: Revenue
    format: { type: currency, currency: USD, decimals: 2 }
  - name: completion_rate
    label: Completion Rate
    expression: "SAFE_DIVIDE({completed_orders}, {order_count})"
    group: Rates
    format: { type: percentage, decimals: 1 }
  - name: cancellation_rate
    label: Cancellation Rate
    expression: "SAFE_DIVIDE({cancelled_orders}, {order_count})"
    group: Rates
    format: { type: percentage, decimals: 1 }
  - name: high_value_share
    label: High-Value Share
    description: Share of orders worth at least $300
    expression: "SAFE_DIVIDE({high_value_orders}, {order_count})"
    group: Rates
    format: { type: percentage, decimals: 1 }
  - name: running_revenue     # window: type + order_by + partition_by
    label: Running Revenue
    expression: "{gross_revenue}"
    window:
      type: running_total
      order_by: created_at
      partition_by: [status]
  - name: prev_revenue        # window: lag + offset
    expression: "{gross_revenue}"
    hidden: true
    window:
      type: lag
      order_by: created_at
      offset: 1

segments:
  - name: completed           # name + label + description + filter
    label: Completed
    description: Only fulfilled orders
    filter: "status = 'completed'"
  - name: high_value
    label: High Value
    filter: "amount >= 300"
  - name: completed_high_value      # multiple conditions with AND
    label: Completed High Value
    description: Fulfilled orders worth at least $300
    filter: "status = 'completed' AND amount >= 300"
  - name: active_orders             # IN list + NOT + range
    label: Active Orders
    description: Non-cancelled orders in a mid-range amount band
    filter: "status IN ('completed', 'pending') AND status != 'cancelled' AND amount BETWEEN 50 AND 500"
  - name: recent_or_large           # grouped OR across conditions
    label: Recent or Large
    description: Placed in the last 30 days, or any order over $400
    filter: >-
      (created_at >= timestamp_sub(current_timestamp(), interval 30 day))
      OR (amount >= 400)
  - name: notable_completed         # long multi-line predicate
    label: Notable Completed
    description: Completed orders that are either recent or high value, excluding tiny amounts
    filter: >-
      status = 'completed'
      AND amount > 25
      AND (
        amount >= 300
        OR created_at >= timestamp_sub(current_timestamp(), interval 7 day)
      )
