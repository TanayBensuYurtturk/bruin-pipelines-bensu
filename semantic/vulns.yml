schema: v1
name: vulns
label: Exploited Vulnerabilities
description: CISA Known Exploited Vulnerabilities, one row per CVE, with today's EPSS score..
source:
  connection: gcp-default
  table: bruin-playground-bensu.security.vulns
primary_key: cve_id

dimensions:
  - name: cve_id
    label: CVE
    type: string
  - name: vendor
    label: Vendor
    type: string
  - name: product
    label: Product
    type: string
  - name: name
    label: Vulnerability
    type: string
  - name: date_added
    label: Date Added
    description: When CISA added the CVE to the catalog
    type: time
    granularities:
      week: date_trunc(date_added, WEEK(MONDAY))
      month: date_trunc(date_added, MONTH)
      year: date_trunc(date_added, YEAR)
  - name: due_date
    label: Patch Due Date
    description: CISA deadline for federal agencies to patch
    type: time
  - name: is_ransomware
    label: Used in Ransomware
    type: boolean
  - name: epss
    label: EPSS Score
    description: Probability of exploitation in the next 30 days (0 to 1)
    type: number
  - name: published_date
    label: Published
    description: When the CVE was first published
    type: time
    granularities:
      month: date_trunc(published_date, MONTH)
      year: date_trunc(published_date, YEAR)
  - name: days_to_exploit
    label: Days to Exploit
    description: Days from CVE publication to CISA adding it to KEV
    type: number
  - name: cvss_score
    label: CVSS
    type: number
  - name: cvss_severity
    label: Severity
    type: string
  - name: cwe
    label: Weakness (CWE)
    type: string
  - name: description
    label: Description
    type: string
  - name: weakness_type
    label: Weakness Type
    description: Plain-language group of the CVE's CWE weakness
    type: string
    expression: |
      CASE
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(77|78|88|94|89|74|917|1336|95|91|611)\b') THEN 'Injection'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(287|288|290|306|862|863|284|285|269|639|1390|425|420|640|521|307|295|264|276|347|732)\b') THEN 'Access Control'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(787|416|119|125|120|122|121|190|189|843|476|415|124|822|823|824|908|788)\b') THEN 'Memory Bugs'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-502\b') THEN 'Deserialization'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(22|23|24|35|36|59|73)\b') THEN 'Path Traversal'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-434\b') THEN 'File Upload'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-918\b') THEN 'SSRF'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(79|80)\b') THEN 'XSS'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(798|259|321|522|200|312|532)\b') THEN 'Leaked Secrets'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-20\b') THEN 'Input Validation'
        WHEN REGEXP_CONTAINS(CONCAT(IFNULL(cwe_ids, ''), ' ', IFNULL(cwe, '')), r'CWE-(362|367)\b') THEN 'Race Condition'
        ELSE 'Unknown'
      END
  - name: exploit_speed
    label: Time to Exploit
    description: How long after the CVE was published it showed up as exploited
    type: string
    expression: |
      CASE
        WHEN days_to_exploit < 0 THEN 'Before disclosure'
        WHEN days_to_exploit <= 7 THEN 'Within a week'
        WHEN days_to_exploit <= 30 THEN 'Within a month'
        WHEN days_to_exploit <= 365 THEN 'Within a year'
        WHEN days_to_exploit > 365 THEN 'Over a year'
      END
  - name: exploit_speed_rank
    label: Time to Exploit (order)
    type: number
    hidden: true
    expression: |
      CASE
        WHEN days_to_exploit < 0 THEN 1
        WHEN days_to_exploit <= 7 THEN 2
        WHEN days_to_exploit <= 30 THEN 3
        WHEN days_to_exploit <= 365 THEN 4
        WHEN days_to_exploit > 365 THEN 5
      END
  - name: ransomware_label
    label: Ransomware
    type: string
    expression: "IF(is_ransomware, 'Used in ransomware', 'Not known in ransomware')"

metrics:
  - name: vuln_count
    label: Exploited Vulnerabilities
    expression: count(*)
    format: { type: number }
  - name: ransomware_count
    label: Used in Ransomware
    expression: count(*)
    filter: "is_ransomware"
    format: { type: number }
  - name: ransomware_share
    label: Ransomware Share
    expression: "SAFE_DIVIDE({ransomware_count}, {vuln_count})"
    format: { type: percentage, decimals: 1 }
  - name: vendor_count
    label: Vendors Affected
    expression: count(distinct vendor)
    format: { type: number }
  - name: avg_epss
    label: Avg EPSS
    expression: avg(epss)
    format: { type: percentage, decimals: 1 }
  - name: high_risk_count
    label: High Risk (EPSS ≥ 50%)
    expression: count(*)
    filter: "epss >= 0.5"
    format: { type: number }

  - name: median_days_to_exploit
    label: Median Days to Exploit
    expression: "APPROX_QUANTILES(days_to_exploit, 2)[OFFSET(1)]"
    format: { type: number }
  - name: fast_exploit_count
    label: Exploited Within a Week
    expression: count(*)
    filter: "days_to_exploit <= 7"
    format: { type: number }
  - name: fast_exploit_share
    label: Exploited Within a Week of Disclosure
    expression: "SAFE_DIVIDE({fast_exploit_count}, {vuln_count})"
    format: { type: percentage, decimals: 0 }
  - name: avg_cvss
    label: Avg CVSS
    expression: avg(cvss_score)
    format: { type: number, decimals: 1 }

segments:
  - name: this_year
    label: Added This Year
    filter: "date_added >= date_trunc(current_date(), YEAR)"
  - name: last_30_days
    label: Added in Last 30 Days
    filter: "date_added >= date_sub(current_date(), INTERVAL 30 DAY)"
  - name: due_soon
    label: Patch Due in Next 30 Days
    filter: "due_date BETWEEN current_date() AND date_add(current_date(), INTERVAL 30 DAY)"
