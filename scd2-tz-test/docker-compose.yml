name: scd2-tz-test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scd2
      POSTGRES_PASSWORD: scd2pass
      POSTGRES_DB: scd2db
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scd2 -d scd2db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: scd2db
      MYSQL_USER: scd2
      MYSQL_PASSWORD: scd2pass
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uscd2", "-pscd2pass"]
      interval: 5s
      timeout: 5s
      retries: 15

  oracle:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: scd2pass
      APP_USER: scd2
      APP_USER_PASSWORD: scd2pass
    ports:
      - "15210:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
