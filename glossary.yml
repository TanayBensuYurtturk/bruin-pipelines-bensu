domains:
  customer-management:
    description: Customer data, registration, and account management
    owners:
      - "Customer Success Team"
    tags:
      - customer
    contact:
      - type: "email"
        address: "team@example.com"
  commerce:
    description: Orders, payments, and fulfillment
    owners:
      - "Commerce Team"
    tags:
      - orders

entities:
  Customer:
    description: An individual or business registered on the platform
    domains:
      - customer-management
    attributes:
      ID:
        type: integer
        description: Unique customer identifier
      Email:
        type: string
        description: Registration email address
      Language:
        type: string
        description: Language selected during signup

  Order:
    description: A purchase placed by a customer
    domains:
      - commerce
    attributes:
      ID:
        type: integer
        description: Unique order identifier
      CustomerID:
        type: integer
        description: Foreign key to Customer.ID
      Total:
        type: float
        description: Order total in the customer's local currency
      Status:
        type: string
        description: Current order status (pending, paid, shipped, cancelled)
