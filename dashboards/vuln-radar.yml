name: Vuln Radar
description: Security flaws that attackers are actually using today, from the CISA Known Exploited Vulnerabilities (KEV) list, enriched with CVE records and EPSS scores. Refreshed daily.
connection: gcp-default
model: vulns # semantic/vulns.yml

filters:
  - name: added
    type: date-range
    default: this_year
    options:
      presets: [last_30_days, last_90_days, this_year, all_time]
  - name: vendor
    type: select
    multiple: true
    default: []
    options:
      dimension: vendor
      metric: vuln_count
  - name: product
    type: select
    multiple: true
    default: []
    options:
      dimension: product
      metric: vuln_count
  - name: cve
    type: select
    multiple: true
    default: []
    options:
      dimension: cve_id

queries:
  by_speed:
    model: vulns
    dimensions:
      - name: exploit_speed
      - name: exploit_speed_rank
    metrics: [vuln_count]
    filters: &added_scope
      - dimension: date_added
        operator: between
        value: { start: "{{ filters.added.start }}", end: "{{ filters.added.end }}" }
      - dimension: vendor
        operator: in
        value: "{{ filters.vendor }}"
      - dimension: product
        operator: in
        value: "{{ filters.product }}"
      - dimension: cve_id
        operator: in
        value: "{{ filters.cve }}"
    sort:
      - name: exploit_speed_rank
        direction: asc
  by_severity:
    model: vulns
    dimensions:
      - name: cvss_severity
    metrics: [vuln_count]
    filters: *added_scope
    sort:
      - name: vuln_count
        direction: desc
  by_month:
    model: vulns
    dimensions:
      - name: date_added
        granularity: month
      - name: ransomware_label
    metrics: [vuln_count]
    filters: *added_scope
    sort:
      - name: date_added
        direction: asc
  by_weakness:
    model: vulns
    dimensions:
      - name: weakness_type
    metrics: [vuln_count]
    filters:
      - dimension: date_added
        operator: between
        value: { start: "{{ filters.added.start }}", end: "{{ filters.added.end }}" }
      - dimension: vendor
        operator: in
        value: "{{ filters.vendor }}"
      - dimension: product
        operator: in
        value: "{{ filters.product }}"
      - dimension: cve_id
        operator: in
        value: "{{ filters.cve }}"
      - dimension: weakness_type
        operator: not_equals
        value: Unknown
    sort:
      - name: vuln_count
        direction: desc
  top_vendors:
    model: vulns
    dimensions:
      - name: vendor
    metrics: [vuln_count]
    filters: *added_scope
    sort:
      - name: vuln_count
        direction: desc
    limit: 10

rows:
  - widgets:
      - name: How to read this
        type: text
        content: |
          **Exploited** = CISA confirmed attackers used it in the wild. **Time to exploit** = days from the CVE being published to CISA listing it as exploited. **CVSS** = how severe the vendor rates the flaw. **EPSS** = chance it gets exploited (again) in the next 30 days. **Patch due** = CISA's deadline for US federal agencies.
        col: 12

  - widgets:
      - name: Exploited Vulnerabilities
        type: metric
        metric: vuln_count
        filters: *added_scope
        value: { field: vuln_count, type: number, format: ",.0f" }
        col: 3
      - name: Median Days from Disclosure to Exploit
        type: metric
        metric: median_days_to_exploit
        filters: *added_scope
        value: { field: median_days_to_exploit, type: number, format: ",.0f" }
        col: 3
      - name: Exploited Within a Week of Disclosure
        type: metric
        metric: fast_exploit_share
        filters: *added_scope
        value: { field: fast_exploit_share, type: number, format: ".0%" }
        col: 3
      - name: Patch Deadline in Next 30 Days
        type: metric
        metric: vuln_count
        segments: [due_soon]
        filters: &scope
          - dimension: vendor
            operator: in
            value: "{{ filters.vendor }}"
          - dimension: product
            operator: in
            value: "{{ filters.product }}"
          - dimension: cve_id
            operator: in
            value: "{{ filters.cve }}"
        value: { field: vuln_count, type: number, format: ",.0f" }
        col: 3

  - widgets:
      - name: How Fast Were They Exploited After Being Published?
        type: chart
        chart: bar
        query: by_speed
        x: { field: exploit_speed, type: category }
        y: { field: vuln_count, type: number, title: Vulnerabilities }
        col: 7
      - name: How Severe Are They? (CVSS rating)
        type: chart
        chart: pie
        query: by_severity
        label: cvss_severity
        value: { field: vuln_count }
        slices:
          CRITICAL: { color: "#DC2626", label: Critical }
          HIGH: { color: "#F97316", label: High }
          MEDIUM: { color: "#EAB308", label: Medium }
          LOW: { color: "#22C55E", label: Low }
        col: 5

  - widgets:
      - name: Newly Exploited Vulnerabilities per Month
        type: chart
        chart: bar
        query: by_month
        x: { field: date_added, type: date }
        y: { field: vuln_count, type: number, title: Vulnerabilities }
        color: { field: ransomware_label }
        stacked: true
        col: 12

  - height: 420
    widgets:
      - name: What Kind of Flaws Get Exploited? (where the type is known)
        type: chart
        chart: bar
        query: by_weakness
        horizontal: true
        x: { field: weakness_type, type: category }
        y: { field: vuln_count, type: number }
        col: 6
      - name: Most Exploited Vendors
        type: chart
        chart: bar
        query: top_vendors
        horizontal: true
        x: { field: vendor, type: category }
        y: { field: vuln_count, type: number }
        col: 6

  - widgets:
      - name: Patch Deadline in the Next 30 Days
        type: table
        dimensions:
          - name: cve_id
          - name: vendor
          - name: product
          - name: weakness_type
          - name: cvss_score
          - name: due_date
          - name: epss
        metrics: [vuln_count]
        segments: [due_soon]
        filters: *scope
        sort:
          - name: due_date
            direction: asc
        limit: 50
        columns:
          - { name: cve_id, label: CVE }
          - { name: vendor, label: Vendor }
          - { name: product, label: Product }
          - { name: weakness_type, label: Weakness }
          - { name: cvss_score, label: CVSS }
          - { name: due_date, label: Patch Deadline }
          - { name: epss, label: EPSS, number: { type: percentage, decimals: 1 } }
          - { name: vuln_count, hidden: true }
        col: 12

  - widgets:
      - name: All Exploited Vulnerabilities
        type: table
        dimensions:
          - name: cve_id
          - name: name
          - name: vendor
          - name: product
          - name: weakness_type
          - name: cvss_severity
          - name: published_date
          - name: date_added
          - name: days_to_exploit
          - name: due_date
          - name: is_ransomware
          - name: epss
        metrics: [vuln_count]
        filters: *added_scope
        sort:
          - name: date_added
            direction: desc
        limit: 500
        columns:
          - { name: cve_id, label: CVE }
          - { name: name, label: Vulnerability }
          - { name: vendor, label: Vendor }
          - { name: product, label: Product }
          - { name: weakness_type, label: Weakness }
          - { name: cvss_severity, label: Severity }
          - { name: published_date, label: Published }
          - { name: date_added, label: Exploited (KEV) }
          - { name: days_to_exploit, label: Days to Exploit }
          - { name: due_date, label: Patch Deadline }
          - { name: is_ransomware, label: Ransomware }
          - { name: epss, label: EPSS, number: { type: percentage, decimals: 1 } }
          - { name: vuln_count, hidden: true }
        col: 12
